body{font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:linear-gradient(180deg,#7d1019,#1a4d2c);color:var(--ink);display:flex;justify-content:center}
#snow{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.flake{position:absolute;top:-30px;color:#fff;opacity:.85;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
#app{position:relative;z-index:2;width:100%;max-width:520px;height:100%;display:flex;flex-direction:column;padding:12px}
.lights{height:14px;margin:0 -12px 8px;background:radial-gradient(circle,var(--gold) 3px,transparent 4px) 0 0/28px 14px,radial-gradient(circle,#ff6b6b 3px,transparent 4px) 14px 0/28px 14px;animation:blink 1.4s infinite alternate}
@keyframes blink{from{opacity:.4}to{opacity:1}}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.btn{border:0;border-radius:14px;font:inherit;font-weight:700;cursor:pointer;padding:12px 18px;font-size:16px;transition:transform .1s}
.btn:active{transform:scale(.96)}
.ghost{background:var(--cream);color:var(--red)}
.main{background:var(--red);color:#fff;border:2px solid var(--gold);font-size:20px;padding:16px;width:100%}
.main:disabled{opacity:.45}
.green{background:var(--green);color:#fff}
.badge{background:var(--gold);color:var(--red2);border-radius:99px;padding:1px 8px;margin-left:6px;font-size:14px}
h1,h2{margin:0;color:#fff;text-align:center;text-shadow:0 2px 6px rgba(0,0,0,.4)}
.panel{background:var(--cream);border-radius:20px;padding:16px;flex:1;overflow:auto;border:3px dashed var(--gold)}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;flex:1;color:#fff}
.santa{font-size:110px;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-12px) rotate(4deg)}}
.deco{font-size:34px;letter-spacing:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#fff;border:2px solid var(--green);border-radius:18px;padding:16px 8px;text-align:center;cursor:pointer;font:inherit;color:var(--ink)}
.card:active{background:#e9f6ec}
.card .e{font-size:46px;display:block}
.card b{display:block;margin-top:6px;font-size:18px}
.card small{color:var(--red)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px dashed #d9b98a}
.qty{display:flex;align-items:center;justify-content:center;gap:24px;margin:24px 0}
.qty button{width:64px;height:64px;border-radius:50%;border:3px solid var(--gold);background:var(--red);color:#fff;font-size:34px;cursor:pointer}
.qty span{font-size:52px;font-weight:800;min-width:70px;text-align:center}
.temps{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
.temps button{padding:32px 8px;font-size:22px;border-radius:20px;border:3px solid var(--gold);cursor:pointer;font-family:inherit;font-weight:800}
.hot{background:#e9f6ec;color:var(--green)}.ice{background:#dcf1ff;color:#1b5a86}
.people{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.people button{padding:22px 0;font-size:28px;font-weight:800;border-radius:18px;border:3px solid var(--gold);background:#fff;color:var(--red);cursor:pointer;font-family:inherit}
.prog{text-align:center;font-weight:800;margin:0 0 10px;color:var(--red2)}
.done-bg{flex:1;display:flex;flex-direction:column;border-radius:22px;border:3px solid var(--gold);padding:12px;background:#3a1a1a var(--bg2) center/cover no-repeat;min-height:0}
.done-bg .panel{background:rgba(255,248,236,.9)}
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{background:var(--cream);border:3px solid var(--gold);border-radius:22px;padding:16px;max-width:400px;width:100%;max-height:100%;overflow:auto;text-align:center}
.mbox img{width:100%;max-height:50vh;object-fit:cover;border-radius:14px;margin:10px 0}
.mbox h3{margin:0;color:var(--red);font-size:24px}
.bottom{margin-top:10px}
.total{display:flex;justify-content:space-between;font-weight:800;font-size:18px;padding-top:10px}
.x{background:none;border:0;color:var(--red);font-size:20px;cursor:pointer}
.big{font-size:26px;text-align:center;margin:6px 0 12px}

.homeText{display:flex;flex-direction:column;align-items:center;gap:8px;width:86%;padding:14px 16px;text-align:center;background:rgba(122,16,25,.82);border:2px solid var(--gold);border-radius:20px;backdrop-filter:blur(2px)}

body.staffmode{display:block;overflow:auto;background:linear-gradient(rgba(60,8,14,.72),rgba(10,50,28,.78)),var(--bg2) center/cover fixed no-repeat}
#staff{position:relative;z-index:2;max-width:1100px;margin:0 auto;padding:12px;width:100%}
#staff header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
#staff h1{font-size:26px}
#staff .sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
#staff .ocard{background:var(--cream);border:3px solid var(--gold);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 6px 18px rgba(0,0,0,.4)}
#staff .ocard.warn{border-color:#ff9f1c;background:#fff1d6}
#staff .ocard.late{border-color:#ff3b3b;background:#ffe0e0;animation:pulse 1s infinite alternate}
@keyframes pulse{to{box-shadow:0 0 22px #ff3b3b}}
#staff .head{display:flex;justify-content:space-between;align-items:center}
#staff .no{font-size:26px;font-weight:800;color:var(--red)}
#staff .ppl{background:var(--green);color:#fff;border-radius:99px;padding:2px 12px;font-weight:700}
#staff .timer{font-size:40px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;color:var(--green)}
#staff .warn .timer{color:#c76a00}#staff .late .timer{color:#d00}
#staff .at{text-align:center;font-size:13px;color:#7a5a4a;margin-top:-6px}
#staff .item{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed #d9b98a;font-size:18px}
#staff .item b{color:var(--red)}
#staff .del{background:var(--red);color:#fff;border:2px solid var(--gold);font-size:18px;padding:13px;border-radius:14px;cursor:pointer;font:inherit;font-weight:800;margin-top:4px}
#staff .empty{text-align:center;color:#fff;margin-top:90px;font-size:24px;text-shadow:0 2px 6px rgba(0,0,0,.6)}
#staff .empty .s{font-size:90px;display:block}
#staff .link{color:#fff;font-size:13px}
</style>

function go(v){if(v==='cart')prev=view;view=v;render()}
function back(){
 if(view==='menu'){view='people';cart=[]}
 else if(view==='people')view='home';
 else if(view==='qty')view='menu';
 else if(view==='opt')view='qty';
 else if(view==='cart')view=prev;
 render();
}
function nav(title){
 return `<div class="lights"></div>
 <div class="top"><button class="btn ghost" onclick="back()">⬅ 돌아가기</button>
 ${view!=='cart'?`<button class="btn ghost" onclick="go('cart')">🛒 장바구니<span class="badge">${cnt()}</span></button>`:'<span></span>'}</div>
 <h2>🎄 ${title} 🎄</h2><div style="height:10px"></div>`;
}
function setPeople(n){people=n;cart=[];view='menu';render()}
function closeWarn(){warn=false;render()}
function pick(i){sel=MENU[i];qty=1;go('qty')}
function chg(d){qty=Math.max(1,Math.min(20,qty+d));document.getElementById('q').textContent=qty}
function addCart(t){
 const f=cart.find(c=>c.n===sel.n&&c.t===t);
 if(f)f.q+=qty;else cart.push({n:sel.n,e:sel.e,p:sel.p,t,q:qty});
 view='menu';render();
}
function del(i){cart.splice(i,1);render()}
const ORDER_KEY='nzcafe_orders';
function sendOrder(){
 ORD.send({id:Date.now()+'-'+orderNo,no:orderNo,people:people,time:Date.now(),items:cart.map(c=>({n:c.n,e:c.e,t:c.t,q:c.q}))});
}
function order(){if(!cart.length)return;if(cnt()!==people){warn=true;render();return}orderNo=Math.floor(100+Math.random()*900);finalCart=cart;sendOrder();cart=[];view='done';render()}
function reset(){cart=[];finalCart=[];view='home';people=0;render()}
const list=(arr,rm)=>arr.map((c,i)=>`<div class="row"><span>${c.e} <b>${c.n}</b> (${c.t==='ice'?'🧊 얼음추가':'🥤 일반'}) × ${c.q}</span><span>${rm?`<button class="x" onclick="del(${i})">✖</button>`:''}</span></div>`).join('');
const sum=a=>a.reduce((s,c)=>s+c.p*c.q,0);

 if(view==='home'){
  h=`<div class="home"><div class="homeText">

  </div></div>`;
 }else if(view==='people'){
  h=`<div class="lights"></div><div class="top"><button class="btn ghost" onclick="back()">⬅ 돌아가기</button><span></span></div><h2>🎄 인원 선택 🎄</h2><div style="height:10px"></div>
  <div class="panel"><div class="big">👥 몇 명이서 오셨나요?</div>
  <div class="people">${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="setPeople(${n})">${n}명</button>`).join('')}</div></div>`;
 }else if(view==='menu'){
  h=nav('메뉴')+`<div class="panel"><div class="prog">👥 ${people}명 · 선택한 음료 ${cnt()}/${people}잔</div><div class="grid">${MENU.map((m,i)=>`<button class="card" onclick="pick(${i})"><span class="e">${m.e}</span><b>${m.n}</b></button>`).join('')}</div></div>
  <div class="bottom"><button class="btn main" ${cart.length?'':'disabled'} onclick="order()">🎁 주문하기 (${cnt()}개)</button></div>`;
 }else if(view==='qty'){
  h=nav('수량 선택')+`<div class="panel"><div class="big">${sel.e} ${sel.n}</div>
   <div class="qty"><button onclick="chg(-1)">−</button><span id="q">${qty}</span><button onclick="chg(1)">＋</button></div></div>
   <div class="bottom"><button class="btn main" onclick="go('opt')">다음 ➡</button></div>`;
 }else if(view==='opt'){
  h=nav('옵션 선택')+`<div class="panel"><div class="big">${sel.e} ${sel.n} × ${qty}</div>

 }else if(view==='cart'){
  h=nav('장바구니')+`<div class="panel">${cart.length?list(cart,true)+`<div class="total"><span>인원 ${people}명 / 총 수량</span><span>${cnt()}개</span></div>`:'<div class="big" style="margin-top:40px">🎅 장바구니가 비어 있어요</div>'}</div>
  <div class="bottom"><button class="btn main" ${cart.length?'':'disabled'} onclick="order()">🎁 주문하기</button></div>`;
 }else{
  h=`<div class="lights"></div><h2 style="font-size:28px">🎅 감사합니다! 🎄</h2><div style="height:10px"></div>

  <div class="bottom"><button class="btn main" onclick="reset()">🏠 처음으로</button></div>`;
 }

 app.innerHTML=h;
}
render();

<script>
// ===== 주문 저장소: 공유 DB(모든 기기) → 안 되면 이 브라우저 localStorage =====
const ORD=(()=>{
 const KEY='nzcafe_orders';let col=null,mode='local';
 const lget=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return []}};
 const lset=a=>{try{localStorage.setItem(KEY,JSON.stringify(a))}catch(e){}};
 const ready=(async()=>{try{if(window.claude&&claude.use){const db=await claude.use('db');if(db){col=db.collection('orders');mode='db'}}}catch(e){}})();
 return{ready,mode:()=>mode,
  async send(o){await ready;if(col){try{await col.doc(o.id).set(o);return}catch(e){console.error(e)}}const a=lget();a.push(o);lset(a)},
  async remove(id){await ready;if(col){try{await col.doc(id).delete();return}catch(e){console.error(e)}}lset(lget().filter(o=>o.id!==id))},
  async subscribe(cb){await ready;
   if(col){col.onSnapshot(sn=>cb(sn.docs.map(d=>d.data()).sort((a,b)=>a.time-b.time)),e=>console.error(e));return}
   const f=()=>cb(lget());f();window.addEventListener('storage',e=>{if(e.key===KEY)f()});setInterval(f,1500)}
 };
})();
// ===== 직원용 주문 접수 화면 =====
(()=>{
 const $=id=>document.getElementById(id);const WARN=300000,LATE=600000;

 const fmt=ms=>{const t=Math.max(0,Math.floor(ms/1000));return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')};
 const clock=t=>new Date(t).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
 const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const opt=t=>t==='ice'?'🧊 얼음추가':'🥤 일반';
 function ding(){try{const A=new (window.AudioContext||window.webkitAudioContext)();const o=A.createOscillator(),g=A.createGain();o.connect(g);g.connect(A.destination);o.frequency.value=880;g.gain.value=.15;o.start();o.stop(A.currentTime+.25)}catch(e){}}
 function draw(){
  $('scnt').textContent='대기 '+orders.length+'팀';
  $('slist').innerHTML=orders.length?`<div class="sgrid">${orders.map(o=>`<div class="ocard"><div class="head"><span class="no">🎁 ${esc(o.no)}번</span><span class="ppl">👥 ${esc(o.people)}명</span></div><div class="timer" data-t="${Number(o.time)}">00:00</div><div class="at">주문 시각 ${clock(o.time)}</div>${(o.items||[]).map(i=>`<div class="item"><span>${esc(i.e)} ${esc(i.n)} <small>(${opt(i.t)})</small></span><b>× ${esc(i.q)}</b></div>`).join('')}<button class="del" data-id="${esc(o.id)}">✅ 제작 완료 · 삭제</button></div>`).join('')}</div>`
   :'<div class="empty"><span class="s">🎅</span>대기 중인 주문이 없어요<br>산타도 잠시 휴식 ⛄</div>';
  $('slist').querySelectorAll('.del').forEach(b=>b.onclick=()=>ORD.remove(b.dataset.id));
  tick();
 }
 function tick(){const n=Date.now();document.querySelectorAll('#staff [data-t]').forEach(el=>{const d=n-Number(el.dataset.t);el.textContent=fmt(d);const c=el.closest('.ocard');c.classList.toggle('late',d>=LATE);c.classList.toggle('warn',d>=WARN&&d<LATE)})}
 window.startStaff=function(){
  $('sconn').textContent=ORD.mode()==='db'?'🟢 실시간 연결':'🟡 이 브라우저만';
  ORD.ready.then(()=>{$('sconn').textContent=ORD.mode()==='db'?'🟢 실시간 연결 (모든 기기)':'🟡 이 브라우저에서만 연결'});
  if(started)return;started=true;
  ORD.subscribe(a=>{const s=a.map(o=>o.id).join(',');if(s===sig&&inited)return;const added=inited&&a.length>orders.length;sig=s;orders=a;inited=true;draw();if(added)ding()});
  setInterval(tick,1000);
  $('stest').onclick=()=>{const no=Math.floor(100+Math.random()*900);ORD.send({id:Date.now()+'-'+no,no,people:2,time:Date.now(),items:[{n:'딸기라떼',e:'🍓',t:'normal',q:1},{n:'유자차',e:'🍋',t:'ice',q:1}]})};
 };
 function route(){const st=location.hash==='#staff';$('app').style.display=st?'none':'';$('staff').style.display=st?'block':'none';document.body.classList.toggle('staffmode',st);document.getElementById('snow').style.display='';if(st)startStaff()}
 window.addEventListener('hashchange',route);route();
})();
</script>
</body>
</html>
